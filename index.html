9seaux diff\xE9rents entre eux et choisit le chemin des paquets.","**Pare-feu** : filtre le trafic selon des r\xE8gles (dans Trame, les ACL du routeur jouent ce r\xF4le pour l\u2019instant).","**Point d\u2019acc\xE8s Wi-Fi** : relie les appareils sans fil au r\xE9seau local (mod\xE8le simplifi\xE9 dans Trame)."]},{t:"tip",text:"Dans Trame, faites glisser un \xE9quipement depuis la biblioth\xE8que \xE0 gauche. Chaque fiche indique le mod\xE8le simul\xE9 et ses limites."}],glossary:[["Trame","Unit\xE9 de donn\xE9es circulant sur un r\xE9seau local (niveau 2), avec des adresses MAC."],["Paquet","Unit\xE9 de donn\xE9es rout\xE9e entre r\xE9seaux (niveau 3), avec des adresses IP."]],practice:"ex-deux-pc"},{id:"c2",num:2,title:"Relier deux machines",minutes:5,summary:"C\xE2bles, ports et \xE9tat des liens.",blocks:[{t:"p",text:"Un c\xE2ble Ethernet relie un **port** d\u2019un \xE9quipement \xE0 un port d\u2019un autre. Le lien n\u2019est **actif** que si les deux ports sont activ\xE9s."},{t:"ul",items:["Point **vert** : port actif.","Point **rouge** : port d\xE9sactiv\xE9 (commande `shutdown`).","Point **gris** : rien n\u2019est branch\xE9 en face, ou le port d\u2019en face est d\xE9sactiv\xE9."]},{t:"p",text:"Sur un switch, chaque port a un nom : `FastEthernet0/1` (abr\xE9g\xE9 `Fa0/1`) chez Cisco, `port1.0.1` chez Allied Telesis."},{t:"tip",text:"Outil C\xE2ble (touche C) : cliquez sur un \xE9quipement, choisissez le port, puis cliquez sur le second \xE9quipement."}],glossary:[["Port","Prise r\xE9seau d\u2019un \xE9quipement."],["Lien","Connexion entre deux ports par un c\xE2ble."]],practice:"ex-cablage"},{id:"c3",num:3,title:"Adresses IP et masques",minutes:8,summary:"Lire une adresse, savoir si deux machines sont dans le m\xEAme r\xE9seau.",blocks:[{t:"p",text:"Une **adresse IPv4** est compos\xE9e de 4 nombres de 0 \xE0 255, par exemple `192.168.1.10`. Le **masque** indique quelle partie de l\u2019adresse d\xE9signe le r\xE9seau."},{t:"p",text:"Avec le masque `255.255.255.0` (not\xE9 aussi **/24**), les trois premiers nombres d\xE9signent le r\xE9seau : `192.168.1.10` et `192.168.1.20` sont dans le m\xEAme r\xE9seau `192.168.1.0`."},{t:"ul",items:["M\xEAme r\xE9seau : les machines communiquent directement \xE0 travers les switchs.","R\xE9seaux diff\xE9rents : il faut un **routeur** et une **passerelle par d\xE9faut**.","La premi\xE8re adresse (`.0`) d\xE9signe le r\xE9seau et la derni\xE8re (`.255`) sert \xE0 la diffusion : on ne les donne pas aux machines."]},{t:"tip",text:"Si deux PC n\u2019ont pas le m\xEAme r\xE9seau, le ping \xE9choue et Trame vous explique pourquoi."}],glossary:[["Masque","Indique la taille du r\xE9seau, ex. 255.255.255.0 = /24."],["Passerelle","Adresse du routeur qui permet de sortir du r\xE9seau local."]],practice:"ex-depannage"},{id:"c4",num:4,title:"Les premi\xE8res commandes",minutes:8,summary:"Modes de commande Cisco et Allied Telesis, ping, ipconfig.",blocks:[{t:"p",text:"Les switchs et routeurs se configurent en ligne de commande. On passe par plusieurs **modes** :"},{t:"code",text:`Switch>                 mode utilisateur (consultation)
Switch> enable
Switch#                 mode privil\xE9gi\xE9
Switch# configure terminal
Switch(config)#         configuration globale
Switch(config)# interface fa0/1
Switch(config-if)#      configuration d\u2019une interface`},{t:"ul",items:["`?` affiche l\u2019aide contextuelle, **Tab** compl\xE8te la commande, les fl\xE8ches rappellent l\u2019historique.","Les abr\xE9viations sont accept\xE9es : `conf t`, `sh ip int br`.","`show running-config` affiche la configuration en cours ; `copy running-config startup-config` l\u2019enregistre.","Sur un PC : `ipconfig` affiche l\u2019adresse, `ping 192.168.1.11` teste la connexion."]},{t:"p",text:"Allied Telesis (AlliedWare Plus) utilise des modes semblables (`awplus>`, `awplus#`, `awplus(config)#`), mais certaines commandes diff\xE8rent : les VLAN se cr\xE9ent dans `vlan database` et les adresses s\u2019\xE9crivent en notation CIDR (`192.168.1.2/24`)."}],glossary:[["CLI","Interface en ligne de commande."],["running-config","Configuration active en m\xE9moire (perdue au red\xE9marrage si non enregistr\xE9e)."]],practice:"ex-depannage"},{id:"c5",num:5,title:"Cr\xE9er un VLAN",minutes:8,summary:"D\xE9couper un switch en plusieurs r\xE9seaux isol\xE9s.",blocks:[{t:"p",text:"Un **VLAN** (r\xE9seau local virtuel) d\xE9coupe un switch en plusieurs r\xE9seaux s\xE9par\xE9s. Deux PC dans des VLAN diff\xE9rents ne se voient pas, m\xEAme branch\xE9s sur le m\xEAme switch."},{t:"code",text:`Cisco :
Switch(config)# vlan 10
Switch(config-vlan)# name COMPTA

Allied Telesis :
awplus(config)# vlan database
awplus(config-vlan)# vlan 10 name COMPTA`},{t:"tip",text:"V\xE9rifiez avec `show vlan brief` (Cisco et Allied Telesis)."}],glossary:[["VLAN","R\xE9seau virtuel identifi\xE9 par un num\xE9ro de 1 \xE0 4094. Le VLAN 1 existe par d\xE9faut."]],practice:"ex-vlan"},{id:"c6",num:6,title:"Configurer des ports : acc\xE8s et trunk",minutes:8,summary:"Ports d\u2019acc\xE8s, liens trunk 802.1Q, VLAN natif.",blocks:[{t:"ul",items:["**Port d\u2019acc\xE8s** : appartient \xE0 un seul VLAN, on y branche un PC.","**Port trunk** : transporte plusieurs VLAN entre deux switchs (ou vers un routeur). Chaque trame porte une **\xE9tiquette 802.1Q** avec le num\xE9ro de VLAN.","**VLAN natif** : VLAN dont les trames passent sans \xE9tiquette sur un trunk (VLAN 1 par d\xE9faut)."]},{t:"code",text:`Cisco :
interface fa0/1
 switchport mode access
 switchport access vlan 10
interface gi0/1
 switchport mode trunk

Allied Telesis :
interface port1.0.1
 switchport access vlan 10
interface port1.0.10
 switchport mode trunk
 switchport trunk allowed vlan add 10`},{t:"tip",text:"Diff\xE9rence importante : sur Cisco, un trunk autorise tous les VLAN par d\xE9faut ; sur Allied Telesis, il faut les ajouter avec \xAB allowed vlan add \xBB."}],glossary:[["802.1Q","Norme qui ajoute une \xE9tiquette VLAN aux trames sur un trunk."]],practice:"ex-trunk"},{id:"c7",num:7,title:"Faire communiquer des r\xE9seaux ou des VLAN",minutes:10,summary:"Routeur, passerelle, router-on-a-stick.",blocks:[{t:"p",text:"Pour passer d\u2019un r\xE9seau \xE0 un autre, une machine envoie ses paquets \xE0 sa **passerelle par d\xE9faut** : l\u2019adresse du routeur dans son r\xE9seau. Le routeur consulte sa **table de routage** (`show ip route`) pour choisir l\u2019interface de sortie."},{t:"p",text:"Pour router entre VLAN avec un seul c\xE2ble, on cr\xE9e des **sous-interfaces** sur le routeur, une par VLAN : c\u2019est le \xAB router-on-a-stick \xBB."},{t:"code",text:`interface g0/0
 no shutdown
interface g0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0`},{t:"p",text:"Pour joindre un r\xE9seau qui n\u2019est pas directement reli\xE9, on ajoute une **route statique** : `ip route 10.0.0.0 255.0.0.0 192.168.2.2`."}],glossary:[["Table de routage","Liste des r\xE9seaux connus par le routeur et de la fa\xE7on de les joindre."],["Sous-interface","Interface logique cr\xE9\xE9e sur une interface physique (ex. g0/0.10)."]],practice:"ex-passerelle"},{id:"c8",num:8,title:"D\xE9couvrir DHCP et le routage",minutes:8,summary:"Attribuer automatiquement les adresses.",blocks:[{t:"p",text:"**DHCP** distribue automatiquement une adresse IP, un masque, une passerelle et un DNS aux machines. Le client diffuse un message (Discover), le serveur r\xE9pond (Offer), le client confirme (Request) et le serveur valide (Ack)."},{t:"code",text:`R1(config)# ip dhcp excluded-address 192.168.1.1 192.168.1.9
R1(config)# ip dhcp pool LAN
R1(dhcp-config)# network 192.168.1.0 255.255.255.0
R1(dhcp-config)# default-router 192.168.1.1
R1(dhcp-config)# dns-server 8.8.8.8`},{t:"ul",items:["Le serveur DHCP doit \xEAtre dans le m\xEAme VLAN que les clients (le relais `ip helper-address` n\u2019est pas encore simul\xE9).","Sans r\xE9ponse, un PC Windows prend une adresse **APIPA** en 169.254.x.x : signe d\u2019un probl\xE8me DHCP.","Le serveur g\xE9n\xE9rique de Trame propose aussi un service DHCP dans son onglet \xAB Services \xBB."]},{t:"tip",text:"En mode Simulation, choisissez \xAB DHCP \xBB pour voir passer les quatre messages."}],glossary:[["Bail DHCP","Adresse pr\xEAt\xE9e \xE0 un client pour une dur\xE9e donn\xE9e."],["APIPA","Adresse automatique 169.254.x.x utilis\xE9e quand DHCP \xE9choue."]],practice:"ex-dhcp"},{id:"c9",num:9,title:"Filtrer le trafic avec une ACL",minutes:8,summary:"Les r\xE8gles de base d\u2019un pare-feu sur un routeur.",blocks:[{t:"p",text:"Une **ACL** (liste de contr\xF4le d\u2019acc\xE8s) est une liste de r\xE8gles `permit` (autoriser) ou `deny` (refuser) lues de haut en bas. La premi\xE8re r\xE8gle qui correspond s\u2019applique. \xC0 la fin, une r\xE8gle invisible refuse tout le reste."},{t:"ul",items:["**Standard** (1 \xE0 99) : filtre selon l\u2019adresse source.","**\xC9tendue** (100 \xE0 199) : filtre selon la source, la destination et le protocole (ip ou icmp dans Trame).","On l\u2019applique \xE0 une interface, en entr\xE9e (`in`) ou en sortie (`out`)."]},{t:"code",text:`access-list 10 deny host 192.168.1.11
